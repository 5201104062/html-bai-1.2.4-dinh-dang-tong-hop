<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Nội dung thanh tiêu đề (hiện trên tab trình duyệt) -->
    <title>Cô hái mơ</title>
    <style>
        /* Thẻ pre mặc định dùng phông chữ đều nét (monospace);
           đổi sang phông có chân để giống hình mẫu 1.7 */
        pre {
            font-family: "Times New Roman", Times, serif;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <!--
        Bài 1.2.4. Định dạng tổng hợp
        - Định dạng chữ: đậm <b>, nghiêng <i>, gạch chân <u>, gạch ngang <s>
        - Phân cách các đoạn: tiêu đề <h1>, bài thơ <pre>, dòng tác giả <p>
        - Thẻ pre giữ nguyên cách xuống dòng của từng câu thơ và
          không để câu thơ bị rớt dòng khi cửa sổ trình duyệt hẹp lại
        - Đoạn chữ này là câu ghi chú (comment): trình duyệt không hiển thị nó
    -->
    <h1 align="center">CÔ HÁI MƠ</h1>

    <pre><i>Thơ thẩn đường chiều một khách thơ,</i>
<i>Say nhìn xa rặng núi xanh lơ,</i>
Khi trời lặng lẽ và trong trẻo,
Thấp thoáng rừng mơ, <b>Cô hái mơ.</b></pre>

    <!-- "Vô danh" bị gạch ngang vì bài thơ này là của nhà thơ Nguyễn Bính -->
    <p><u>Tác giả</u>: <i><s>Vô danh</s></i> Nguyễn Bính</p>
</body>
</html>
